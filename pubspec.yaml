name: rgb
description: "RGB — a neon piano-tiles style reflex game."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State / storage
  shared_preferences: ^2.2.3
  provider: ^6.1.2

  # Firebase (auth + leaderboards)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # Ads
  google_mobile_ads: ^5.1.0

  # Audio
  audioplayers: ^6.1.0

  # Misc
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
