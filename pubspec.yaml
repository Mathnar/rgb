name: rgb
description: "RGB — a neon piano-tiles style reflex game."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State / storage
  shared_preferences: ^2.2.3
  provider: ^6.1.2

  # Firebase (auth + leaderboards)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # Ads
  google_mobile_ads: ^5.1.0

  # Audio
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

# App icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/icon_source.png"
  adaptive_icon_background: "#07070B"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"

# Splash screen (run: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#07070B"
  image: "assets/branding/splash_logo.png"
  android: true
  ios: true
  android_12:
    color: "#07070B"
    image: "assets/branding/splash_logo.png"

